<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube → Serum Preset</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
            background: #0a0e27;
            color: #e0e0e0;
            padding: 20px;
            line-height: 1.5;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 30px;
            color: #00d9ff;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #333;
            background: #1a1f3a;
            color: #e0e0e0;
            border-radius: 4px;
            font-size: 14px;
        }
        input::placeholder {
            color: #666;
        }
        button {
            padding: 12px 24px;
            background: #00d9ff;
            color: #000;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover {
            background: #00b8d4;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .logs {
            background: #0f1229;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
            height: 400px;
            overflow-y: auto;
            font-size: 13px;
            color: #00d9ff;
        }
        .log-line {
            margin-bottom: 4px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .log-line.error {
            color: #ff6b6b;
        }
        .results {
            display: none;
            background: #1a1f3a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .results.show {
            display: block;
        }
        .result-item {
            margin-bottom: 15px;
            padding: 12px;
            background: #0f1229;
            border-radius: 4px;
            border-left: 3px solid #00d9ff;
        }
        .result-label {
            font-weight: 600;
            color: #00d9ff;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .result-value {
            color: #e0e0e0;
            word-break: break-all;
            font-size: 13px;
        }
        .download-btn {
            padding: 8px 16px;
            font-size: 12px;
            margin-top: 10px;
            background: #00a86b;
        }
        .download-btn:hover {
            background: #008c5a;
        }
        .spinner {
            display: inline-block;
            width: 4px;
            height: 4px;
            background: #00d9ff;
            border-radius: 50%;
            animation: spin 0.6s infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>YouTube → Serum 2.0.21</h1>

        <div class="input-group">
            <input
                type="url"
                id="urlInput"
                placeholder="Paste YouTube URL here..."
                value=""
            >
            <button id="runBtn" onclick="runPipeline()">Run</button>
        </div>

        <div class="logs" id="logs">
            <div class="log-line">[Ready to process YouTube URL]</div>
        </div>

        <div class="results" id="results">
            <div class="result-item">
                <div class="result-label">Serum Preset</div>
                <div class="result-value" id="presetPath">-</div>
                <button class="download-btn" id="downloadPreset" style="display:none;"
                    onclick="downloadFile(document.getElementById('presetPath').textContent)">
                    Download .SerumPreset
                </button>
            </div>
            <div class="result-item">
                <div class="result-label">Report</div>
                <div class="result-value" id="reportPath">-</div>
                <button class="download-btn" id="downloadReport" style="display:none;"
                    onclick="downloadFile(document.getElementById('reportPath').textContent)">
                    Download Report
                </button>
            </div>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const runBtn = document.getElementById('runBtn');
        const logsDiv = document.getElementById('logs');
        const resultsDiv = document.getElementById('results');

        urlInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') runPipeline();
        });

        async function runPipeline() {
            const url = urlInput.value.trim();
            if (!url) {
                addLog('[ERROR] URL required', true);
                return;
            }

            runBtn.disabled = true;
            logsDiv.innerHTML = '<div class="log-line"><span class="spinner"></span>Processing...</div>';
            resultsDiv.classList.remove('show');

            try {
                const response = await fetch('/api/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();

                if (!response.ok) {
                    addLog(`[ERROR] ${data.error || 'Unknown error'}`, true);
                    runBtn.disabled = false;
                    return;
                }

                // Display all output
                logsDiv.innerHTML = '';
                if (data.stdout) {
                    data.stdout.split('\n').forEach(line => {
                        if (line.trim()) addLog(line);
                    });
                }

                // Show results
                if (data.preset_path || data.report_path) {
                    showResults(data);
                }

                runBtn.disabled = false;
            } catch (err) {
                addLog(`[ERROR] ${err.message}`, true);
                runBtn.disabled = false;
            }
        }

        function addLog(text, isError = false) {
            const line = document.createElement('div');
            line.className = `log-line ${isError ? 'error' : ''}`;
            line.textContent = text;
            logsDiv.appendChild(line);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        function showResults(data) {
            if (data.preset_path) {
                document.getElementById('presetPath').textContent = data.preset_path;
                document.getElementById('downloadPreset').style.display = 'inline-block';
            }
            if (data.report_path) {
                document.getElementById('reportPath').textContent = data.report_path;
                document.getElementById('downloadReport').style.display = 'inline-block';
            }
            resultsDiv.classList.add('show');
        }

        function downloadFile(filepath) {
            if (!filepath || filepath === '-') {
                alert('No file available');
                return;
            }
            // Encode the filepath and trigger download
            const encodedPath = encodeURIComponent(filepath);
            window.location.href = `/api/download/${encodedPath}`;
        }
    </script>
</body>
</html>
